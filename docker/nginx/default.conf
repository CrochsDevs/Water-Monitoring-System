server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    # Increase max body size for sensor data POSTs
    client_max_body_size 10M;

    # PHP files
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # API endpoint - no auth required for sensor data
    location /api/ {
        try_files $uri $uri/ /api/reading.php?$query_string;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Deny access to db/, docker/ directories
    location ~ ^/(db|docker)/ {
        deny all;
    }
}
